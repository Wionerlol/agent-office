[project]
name = "agent-office"
version = "0.1.0"
description = "A spatial, real-time view of local coding agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.0",
    "gitpython>=3.1.45",
    "httpx>=0.28.1",
    "psutil>=7.0.0",
    "pydantic>=2.11.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.35.0",
    "watchdog>=6.0.0",
]

[project.scripts]
agent-office = "backend.main:run"
office-run = "backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
